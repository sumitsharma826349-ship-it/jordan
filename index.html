<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jorden Support Chat</title>
<style>
:root{--main-red:#05a400;--dark-red:#090088;--text:#171717}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--dark-red),var(--main-red));display:flex;align-items:center;justify-content:center;padding:18px;color:var(--text)}.app{width:100%;max-width:460px;height:min(760px,94vh);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #0005;display:flex;flex-direction:column}.header{background:linear-gradient(135deg,#5C5CFF,#05a400);color:#fff;padding:20px 18px;display:flex;align-items:center;gap:13px}.logo{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--main-red);display:grid;place-items:center;font-weight:900;font-size:22px;border:3px solid #ffd6d6}.header h1{margin:0;font-size:22px}.header p{margin:5px 0 0;font-size:13px;opacity:.92}.status{background:#fff2f2;color:#c3f705;text-align:center;font-size:12px;padding:9px;border-bottom:1px solid #f2d4d4}.messages{flex:1;overflow-y:auto;padding:18px 14px;background:#fafafa}.msg{max-width:82%;padding:11px 13px;margin:9px 0;border-radius:15px;font-size:14px;line-height:1.4;word-wrap:break-word}.bot{background:#eee;border-bottom-left-radius:4px;margin-right:auto}.user{background:var(--main-red);color:#fff;border-bottom-right-radius:4px;margin-left:auto}.time{display:block;font-size:10px;opacity:.65;margin-top:4px;text-align:right}.quick-actions{display:flex;gap:7px;overflow-x:auto;padding:10px 12px 5px;background:#fff}.quick-actions button{white-space:nowrap;border:1px solid #e2baba;background:#fff7f7;color:#9c0000;border-radius:18px;padding:8px 11px;cursor:pointer;font-size:12px}.composer{padding:10px 12px 12px;background:#fff;border-top:1px solid #eee}.input-row{display:flex;gap:8px}#messageInput{min-width:0;flex:1;border:1px solid #d8d8d8;border-radius:22px;padding:12px 14px;font-size:14px;outline:none}.send{width:48px;border:0;border-radius:50%;background:var(--main-red);color:#fff;font-size:20px;cursor:pointer}.whatsapp{display:block;text-align:center;text-decoration:none;background:#20b957;color:#fff;font-weight:bold;padding:11px;border-radius:10px;margin-top:9px;font-size:14px}.footer-note{text-align:center;color:#888;font-size:10px;margin-top:8px}
</style></head><body><main class="app"><header class="header"><div class="logo">J</div><div><h1>Jordan Support</h1><p>24/7 Good Service &amp; Support</p></div></header><div class="status">● Online support available</div><section class="messages" id="messages"><div class="msg bot"> Namaste! aapka swagat hai Whatsapp Support Click Kren .<span class="time">Now</span></div></section><div class="quick-actions"><button onclick="quickMessage('Mujhe support chahiye')">Support</button><button onclick="quickMessage('Mujhe account ki jankari chahiye')">Account Help</button><button onclick="quickMessage('Mujhe agent se baat karni hai')">Talk to Agent</button></div><div class="composer"><div class="input-row"><input id="messageInput" type="text" placeholder="Message likhein..." autocomplete="off"><button class="send" onclick="sendMessage()">➤</button></div><a class="whatsapp" id="whatsappLink" target="_blank" rel="noopener">WhatsApp Support</a><div class="footer-note">Demo chat interface • Real agent chat ke liye backend/WhatsApp connect karein</div></div></main><script>
// APNA WHATSAPP NUMBER YAHAN EDIT KAREIN: country code ke saath, + ya spaces ke bina
const WHATSAPP_NUMBER="918875324039";const messages=document.getElementById('messages'),input=document.getElementById('messageInput'),whatsappLink=document.getElementById('whatsappLink');whatsappLink.href='https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent('Hello, mujhe support chahiye.');function currentTime(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function escapeHtml(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function addMessage(t,type){const d=document.createElement('div');d.className='msg '+type;d.innerHTML=escapeHtml(t)+'<span class="time">'+currentTime()+'</span>';messages.appendChild(d);messages.scrollTop=messages.scrollHeight}function sendMessage(){const t=input.value.trim();if(!t)return;addMessage(t,'user');input.value='';setTimeout(()=>addMessage('Aapka message mil gaya. Kripya WhatsApp Support button se agent se contact karein.','bot'),650)}function quickMessage(t){input.value=t;sendMessage()}input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
</script></body></html>
